name: Automated Uptime Probe & Pages Deploy

on:
  schedule:
    # Runs every 15 minutes 24/7
    - cron: "*/15 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  probe:
    name: Run Probes & Record Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Monitoring Probe Engine
        run: |
          python3 scripts/monitor.py

      - name: Commit and Push Updated Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): update health and latency metrics [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
